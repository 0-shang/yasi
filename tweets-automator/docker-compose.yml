version: '3.8'

services:
  content-automator:
    build: .
    container_name: content-automator-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # 将当前目录下的 my-second-brain 文件夹挂载到容器的 /data 目录
      # 注意：你需要确保你的代码能读取环境变量，或者可以指定知识库路径为 /data
      - ./my-second-brain:/data
