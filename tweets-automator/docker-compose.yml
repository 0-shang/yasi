version: '3.8'

services:
  content-automator:
    build: .
    container_name: content-automator-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # 将上级目录（也就是你的整个知识库）挂载到容器的 /data 目录
      - ../:/data
    environment:
      - WORKSPACE_PATH=/data
      - TWEETS_DIR=/data/tweets
